<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <title>404 &mdash; Page Not Found | PhysioCare Rehabilitation</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
              950: '#042f2e',
            }
          }
        }
      }
    }
  </script>
  
    <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif-header {
      font-family: 'Playfair Display', serif;
    }
    html {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    [dir="rtl"] .rtl-flip,
    [dir="rtl"] [data-lucide="arrow-right"],
    [dir="rtl"] [data-lucide="chevron-right"],
    [dir="rtl"] [data-lucide="arrow-left"],
    [dir="rtl"] [data-lucide="chevron-left"] {
      transform: scaleX(-1);
    }
  </style>
  <style>
    *, ::before, ::after {
      box-sizing: border-box;
    }
    html, body {
      overflow-x: hidden !important;
      max-width: 100vw;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    img, video, iframe, svg {
      max-width: 100%;
      height: auto;
    }
    p, h1, h2, h3, h4, h5, h6 {
      overflow-wrap: break-word;
    }
    header, nav, button, .whitespace-nowrap {
      white-space: nowrap !important;
      word-break: normal !important;
    }
    @media (max-width: 640px) {
      .w-full {
        padding-left: 1rem !important;
        padding-right: 1rem !important;
      }
    }
    @media (max-width: 480px) {
      .text-3xl { font-size: 1.5rem !important; line-height: 2rem !important; }
      .text-4xl, .text-5xl { font-size: 1.75rem !important; line-height: 2.25rem !important; }
      .p-8, .p-10, .p-12 { padding: 1.25rem !important; }
      .px-8, .px-10, .px-12 { padding-left: 1rem !important; padding-right: 1rem !important; }
      .py-16, .py-20 { padding-top: 2.5rem !important; padding-bottom: 2.5rem !important; }
    }
    @media (max-width: 320px) {
      .px-4 { padding-left: 0.5rem !important; padding-right: 0.5rem !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white min-h-screen w-full overflow-x-hidden flex items-center justify-center p-4 py-8">

  <!-- BACKGROUND DECORATIVE GLOW EFFECTS -->
  <div class="fixed inset-0 z-0 pointer-events-none opacity-30">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-brand-500 rounded-full filter blur-3xl animate-pulse"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-teal-500 rounded-full filter blur-3xl"></div>
  </div>

  <!-- OUTSIDE TOP RIGHT CONTROLS (DARK MODE, LTR/RTL, MAIN SITE) -->
  <div class="fixed top-6 right-6 rtl:right-auto rtl:left-6 z-50 flex items-center gap-2.5 whitespace-nowrap flex-shrink-0">
    
    <!-- Dark Mode Toggle Button -->
    <button id="theme-toggle-btn" type="button" title="Toggle Light / Dark Mode" class="p-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-slate-300 border border-slate-700/80 shadow-lg backdrop-blur-md transition-all flex-shrink-0">
      <i id="theme-icon-moon" data-lucide="moon" class="w-4 h-4 hidden dark:block text-amber-300"></i>
      <i id="theme-icon-sun" data-lucide="sun" class="w-4 h-4 block dark:hidden text-amber-500"></i>
    </button>

    <!-- Direction Toggle Button -->
    <button id="rtl-toggle-btn" type="button" title="Toggle Direction (LTR / RTL)" class="px-3 py-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-xs font-bold text-slate-300 border border-slate-700/80 shadow-lg backdrop-blur-md transition-all flex items-center gap-1.5 whitespace-nowrap flex-shrink-0">
      <i class="fa-solid fa-arrows-left-right-to-line text-brand-400 flex-shrink-0 text-xs"></i>
      <span id="rtl-status-badge" class="whitespace-nowrap">LTR</span>
    </button>

    <!-- Main Site Back Button -->
    <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-xs font-bold text-slate-200 border border-slate-700/80 shadow-lg backdrop-blur-md transition-all whitespace-nowrap flex-shrink-0">
      <i data-lucide="home" class="w-3.5 h-3.5 text-brand-400 flex-shrink-0"></i>
      <span class="whitespace-nowrap">Homepage</span>
    </a>

  </div>

  <!-- CENTERED 404 CONTENT CONTAINER -->
  <main class="relative z-10 w-full max-w-3xl rounded-3xl bg-slate-900/90 dark:bg-slate-950/90 border border-slate-800 shadow-2xl backdrop-blur-xl p-8 sm:p-12 text-center space-y-8">
    
    <!-- PhysioCare Logo Badge -->
    <a href="index.html" class="inline-flex items-center gap-2.5 group">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-brand-500 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/20 group-hover:scale-105 transition-transform">
        <i data-lucide="activity" class="w-6 h-6"></i>
      </div>
      <div class="flex flex-col text-left rtl:text-right">
        <span class="text-xl font-extrabold text-white tracking-tight">PhysioCare</span>
        <span class="text-[10px] font-bold uppercase tracking-widest text-brand-400 -mt-1">Medical & Sports Rehab</span>
      </div>
    </a>

    <!-- Big 404 Display & Illustration -->
    <div class="relative py-4">
      <div class="text-8xl sm:text-9xl font-black font-serif-header bg-gradient-to-r from-brand-400 via-teal-300 to-emerald-400 bg-clip-text text-transparent select-none tracking-tighter">
        404
      </div>
    </div>

    <!-- Title & Subtitle Copy -->
    <div class="space-y-3 max-w-xl mx-auto">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
        Oops! You've Strayed Off Your Recovery Path
      </h1>
      <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
        The page you are looking for might have been moved, renamed, or is temporarily unavailable. Let's get your health and navigation back on track!
      </p>
    </div>

    <!-- Live Search Input -->
    <div class="max-w-md mx-auto relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
      <input type="text" onkeypress="if(event.key==='Enter') window.location.href='services.html';" placeholder="Search services, therapists, rehabilitation plans..." class="w-full pl-10 pr-24 py-3 rounded-2xl bg-slate-950 border border-slate-800 text-xs text-white focus:ring-2 focus:ring-brand-500 focus:outline-none" />
      <button onclick="window.location.href='services.html';" class="absolute right-1.5 top-1.5 px-3 py-1.5 rounded-xl bg-brand-500 text-slate-950 text-xs font-bold hover:bg-brand-400 transition-colors">
        Search
      </button>
    </div>

    <!-- Quick Navigation Action Buttons -->
    <div class="pt-4 border-t border-slate-800/80 flex flex-wrap items-center justify-center gap-3">
      <a href="index.html" class="px-5 py-2.5 rounded-xl bg-brand-400 hover:bg-brand-300 text-slate-950 font-bold text-xs shadow-lg shadow-brand-500/20 transition-all flex items-center gap-2">
        <i data-lucide="home" class="w-4 h-4"></i> Return to Homepage
      </a>
      
      <a href="user-dashboard.html" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs border border-slate-700 transition-all flex items-center gap-2">
        <i data-lucide="user" class="w-4 h-4 text-amber-400"></i> Patient Dashboard
      </a>

      <a href="contact.html" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs border border-slate-700 transition-all flex items-center gap-2">
        <i data-lucide="phone-call" class="w-4 h-4 text-emerald-400"></i> Contact Support
      </a>
    </div>

  </main>

  <!-- SCRIPT LOGIC -->
  <script>
    lucide.createIcons();

    // Dark Mode Toggle
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      lucide.createIcons();
    }
    if (themeToggleBtn) themeToggleBtn.addEventListener('click', toggleTheme);
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    // Direction Toggle
    const rtlToggleBtn = document.getElementById('rtl-toggle-btn');
    const rtlStatusBadge = document.getElementById('rtl-status-badge');
    function toggleDirection() {
      const currentDir = document.documentElement.getAttribute('dir');
      const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
      document.documentElement.setAttribute('dir', newDir);
      localStorage.setItem('dir', newDir);
      if (rtlStatusBadge) rtlStatusBadge.textContent = newDir.toUpperCase();
    }
    if (rtlToggleBtn) rtlToggleBtn.addEventListener('click', toggleDirection);
    if (localStorage.getItem('dir') === 'rtl') {
      document.documentElement.setAttribute('dir', 'rtl');
      if (rtlStatusBadge) rtlStatusBadge.textContent = 'RTL';
    }
  </script>
</body>
</html>
